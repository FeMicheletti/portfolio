name: CI

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main
jobs:
    quality:
        name: Quality
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            DATABASE_URL: mysql://portfolio:portfolio@127.0.0.1:3306/portfolio
            NEXT_PUBLIC_SITE_URL: https://felipemicheletti.com
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22.12.0
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Generate Prisma Client
              run: npx prisma generate
            - name: Generate Next.js types
              run: npx next typegen
            - name: Lint
              run: npm run lint
            - name: Typecheck
              run: npm run typecheck
            - name: Unit tests
              run: npm test
            - name: Coverage
              run: npm run test:coverage
            - name: Build
              run: npm run build
            - name: Security audit
              run: npm audit --audit-level=high
